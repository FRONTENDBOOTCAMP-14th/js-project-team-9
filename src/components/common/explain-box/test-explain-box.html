<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>설명창 테스트</title>
    <link rel="stylesheet" href="./explain-box.css" />
  </head>
  <body>
    <!-- 설명창 컴포넌트 -->
    <section class="explain-box" role="region" aria-label="설명창">
      <p class="explain-box__text" aria-live="polite"></p>
      <!-- 스크린리더 전용 안내 영역 -->
      <p class="sr-only" aria-live="polite" id="explain-status"></p>
      <!-- 디자인 외 기능 없어 alt 작성하지 않음 -->
      <img
        class="explain-box__image"
        src="../../../../public/assets/images/note_character.svg"
        alt=""
      />
      <div class="explain-box__buttons">
        <!-- 형민님 버튼 컴포넌트 사용(스타일 클래스 미리 작성했음) -->
        <!-- 모든 버튼은 형민님이 붙이신 스타일 클래스명에 따라 변경이 있을 수 있음 체크필요 -->
        <!-- 접근성 ui 담당자에게 맡김 -->
        <button
          type="button"
          class="btn-prev explain-box__button--prev js-explain-box-btnPrev"
        ></button>
        <button
          type="button"
          class="btn-next explain-box__button--next js-explain-box-btnNext"
        ></button>
      </div>
      <!-- ui 클래스명에 따라 js 클래스명 달라질 수 있음 -->
      <button
        type="button"
        class="explain-box__button--retry js-explain-box-btnRetry"
        hidden
      ></button>
    </section>

    <script type="module">
      import { initExplainBox } from "./explain-box.js";

      let isSpeaking = false;

      // ✅ JSON 대체용 임시 데이터
      const mode = "listen"; // "listen", "see", "together" 등 테스트 가능
      const explanations = [
        { text: "첫 번째 설명입니다.", speak: "첫 설명", retry: true },
        { text: "두 번째 설명입니다.", speak: "둘 설명", retry: true },
        { text: "세 번째 설명입니다.", speak: "셋 설명", retry: true },
      ];

      // ✅ TTS 기능

      function onSpeak(text) {
        if (!text) return;
        isSpeaking = true;

        const utter = new SpeechSynthesisUtterance(text);
        utter.onend = () => {
          isSpeaking = false;
        };
        speechSynthesis.speak(utter);
      }

      // ✅ 설명창 실행
      initExplainBox({
        explanations,
        onSpeak,
        mode,
      });
    </script>
  </body>
</html>
