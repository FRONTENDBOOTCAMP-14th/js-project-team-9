<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../styles/main.css" />
    <link rel="stylesheet" href="./pdf-music-sheet-select-button.css" />
    <script type="module" src="./pdf-music-sheet-modal-opener.js"></script>
    <script type="module" src="./pdf-music-sheet-loader.js"></script>
    <title>악보 선택 버튼 컴포넌트</title>
  </head>
  <body>
    <h1>악보 선택 버튼 컴포넌트</h1>
    <div class="music-sheet">
      <!-- 파일 형식에 따라 iframe 또는 img 요소 추가 -->
      <!-- 추가되는 요소의 클래스는 "music-sheet__container" -->
      <button class="music-sheet__select-button" type="button">
        악보 선택
      </button>
    </div>
    <dialog class="music-sheet-modal">
      <div class="music-sheet-modal__wrapper">
        <h2 class="music-sheet-modal__title">연주할 악보를 선택해 주세요.</h2>
        <ul class="music-sheet-modal__cards">
          <li class="music-sheet-modal__card">
            <button type="button">
              <img
                src="../../../../public/assets/images/thumbnail-sheet-music.JPG"
                alt=""
                width="80"
                height="60"
              />
              <span>beethoven-pathétique-sonata-mvt-3</span>
            </button>
          </li>
          <li class="music-sheet-modal__card">
            <button type="button">
              <img
                src="../../../../public/assets/images/thumbnail-sheet-music.JPG"
                alt=""
                width="80"
                height="60"
              />
              <span>악보 제목</span>
            </button>
          </li>
          <li class="music-sheet-modal__card">
            <button type="button">
              <img
                src="../../../../public/assets/images/thumbnail-sheet-music.JPG"
                alt=""
                width="80"
                height="60"
              />
              <span>악보 제목</span>
            </button>
          </li>
          <li class="music-sheet-modal__card">
            <button type="button">
              <img
                src="../../../../public/assets/images/thumbnail-sheet-music.JPG"
                alt=""
                width="80"
                height="60"
              />
              <span>악보 제목</span>
            </button>
          </li>
          <li class="music-sheet-modal__card">
            <button type="button">
              <img
                src="../../../../public/assets/images/thumbnail-sheet-music.JPG"
                alt=""
                width="80"
                height="60"
              />
              <span>악보 제목</span>
            </button>
          </li>
          <li class="music-sheet-modal__card card-add">
            <button type="button" aria-label="악보 추가">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M11.9395 0.5C13.2976 0.5 14.3633 1.56572 14.3633 2.92383V9.5166H21.0762C22.4341 9.5166 23.4998 10.5816 23.5 11.9395C23.5 13.2976 22.4343 14.3633 21.0762 14.3633H14.3633V21.0762C14.3633 22.4343 13.2976 23.5 11.9395 23.5C10.5816 23.4998 9.5166 22.4341 9.5166 21.0762V14.3633H2.92383C1.56572 14.3633 0.5 13.2976 0.5 11.9395C0.500229 10.5816 1.56586 9.5166 2.92383 9.5166H9.5166V2.92383C9.5166 1.56586 10.5816 0.500229 11.9395 0.5Z"
                  fill="#FFDB0A"
                  stroke="#FFB213"
                />
              </svg>
            </button>
          </li>
        </ul>
      </div>
      <button
        class="music-sheet-modal__button-close"
        type="button"
        aria-label="닫기"
      >
        <img
          src="../../../../public/assets/images/close_btn.svg"
          alt=""
          width="40"
          height="43"
        />
      </button>
    </dialog>
  </body>
</html>
