<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="이형민을 위한 모달 테스트 페이지" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../src/styles/main.css" />
    <title>Pianiverse_modals</title>
  </head>
  <body>
    <!--실험용 개별 버튼들-->
    <button
      class="step-page__btn-settings btn-round js-step-page-btnSettings"
      type="button"
      aria-label="설정"
    >
      <img
        src="/assets/images/settings_btn.svg"
        alt=""
        width="40"
        height="43"
      />
    </button>

    <button
      class="clear-modal__btn-confirm-clear btn-round js-clear-modal-btnConfirmClear"
      type="button"
      aria-label="다음 레벨"
    >
      <img src="/assets/images/back_btn.svg" alt="" width="40" height="43" />
    </button>

    <button
      class="main-page__btn-mode-select btn-square js-main-page-btnModeSelect"
      type="button"
    >
      모드선택
    </button>

    <button
      class="step-page__btn-menu btn-round js-step-page-btnMenu"
      type="button"
      aria-label="메뉴"
    >
      <img src="/assets/images/menu_btn.svg" alt="" width="40" height="43" />
    </button>
  </body>
</html>
