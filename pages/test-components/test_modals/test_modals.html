<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="이형민을 위한 모달 테스트 페이지" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./test_modals_main.css" />
    <script type="module" src="./test_modals.js" defer></script>
    <title>Pianiverse_modals</title>
  </head>
  <body>
    <!--모달 베이스-->
    <dialog class="modal-base js-modal-base-modalBase">
      <button
        class="modal-base__btn-close btn-round js-modal-base-btnClose"
        type="button"
        aria-label="닫기"
      >
        <img
          src="../../../public/assets/images/close_btn.svg"
          alt=""
          width="40"
          height="43"
        />
      </button>
      <div class="js-modal-base-contentArea"></div>
    </dialog>
    <!--모드셀렉트 모달-->
    <div
      class="mode-select-modal__wrapper js-mode-select-modal-modeSelectModalWrapper"
      style="display: none"
    >
      <h2 class="mode-select-modal__title">모드 선택</h2>
      <form class="mode-select-modal__form">
        <input type="radio" name="mode" id="seeMode" value="see" /><label
          for="seeMode"
          >보면서 배우기</label
        >
        <input type="radio" name="mode" id="listenMode" value="listen" /><label
          for="listenMode"
          >들으면서 배우기</label
        >
        <input
          type="radio"
          name="mode"
          id="togetherMode"
          value="together"
        /><label for="togetherMode">함께 배우기</label>
        <button class="mode-select-modal__ok-btn btn-ok" type="submit">
          확인
        </button>
      </form>
    </div>

    <!--다시 시도해 보세요 모달-->
    <div
      class="retry-announce-modal__wrapper js-retry-announce-modal-retryAnnounceModalWrapper"
      style="display: none"
    >
      <p class="modal-annouce">다시 시도해 보세요!</p>
      <button class="btn-ok" type="button">확인</button>
    </div>

    <!--업데이트 예정 모달-->
    <div
      class="to-be-updated-announce-modal__wrapper js-to-be-updated-announce-modal-toBeUpdatedAnnounceModalWrapper"
      style="display: none"
    >
      <p class="to-be-updated-announce-modal__annouce announce">
        다음 단계는<br />업데이트 예정입니다.
      </p>
      <button class="btn-ok js-modal-base-btnClose" type="button">확인</button>
    </div>

    <!--계속하기 다시하기 모달-->
    <div
      class="continue-restart-modal__wrapper js-continue-restart-modal-continueRestartModalWrapper"
      style="display: none"
    >
      <button
        class="continue-restart-modal__btn-continue btn-square"
        type="button"
      >
        계속하기
      </button>
      <button
        class="continue-restart-modal__btn-restart btn-square"
        type="button"
      >
        처음부터
      </button>
    </div>

    <!--개별 버튼들-->
    <button
      class="btn-settings btn-round"
      type="button"
      aria-label="설정"
      style="display: none"
    >
      <img
        src="../../../public/assets/images/settings_btn.svg"
        alt=""
        width="40"
        height="43"
      />
    </button>

    <button
      class="clear-modal__btn-confirm-clear btn-round js-clear-modal-btnConfirmClear"
      type="button"
      aria-label="다음 레벨"
    >
      <img
        src="../../../public/assets/images/back_btn.svg"
        alt=""
        width="40"
        height="43"
      />
    </button>

    <button
      class="main-page__btn-mode-select btn-square js-main-page-btnModeSelect"
      type="button"
    >
      모드선택
    </button>

    <button
      class="step-page__btn-menu btn-round js-step-page-btnMenu"
      type="button"
      aria-label="메뉴"
    >
      <img
        src="../../../public/assets/images/menu_btn.svg"
        alt=""
        width="40"
        height="43"
      />
    </button>
  </body>
</html>
