<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />

      name="description"

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <link rel="stylesheet" href="../../src/styles/main.css" />
    <link rel="stylesheet" href="./home.css" />
    <script type="module" src="./home.js"></script>
